<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Tinker — Studio</title>
<link rel="stylesheet" href="studio.css" />
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #D9D3C8; }
  #root { height: 100%; }
  @keyframes tk-spin { to { transform: rotate(360deg); } }
  @keyframes tk-pulse { 0%, 100% { opacity: 1; transform: scale(1); } 50% { opacity: 0.35; transform: scale(0.7); } }
  /* scrollbars */
  .st-thread::-webkit-scrollbar, .st-preview ::-webkit-scrollbar, .st-lib::-webkit-scrollbar { width: 9px; height: 9px; }
  .st-thread::-webkit-scrollbar-thumb, .st-preview ::-webkit-scrollbar-thumb, .st-lib::-webkit-scrollbar-thumb {
    background: rgba(20,16,40,0.15); border-radius: 9px; border: 2px solid transparent; background-clip: padding-box; }
</style>
</head>
<body>
<div id="root"></div>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script type="text/babel" src="tweaks-panel.jsx" data-presets="env,react"></script>
<script type="text/babel" src="tinker-core.jsx" data-presets="env,react"></script>
<script type="text/babel" src="tinker-chat.jsx" data-presets="env,react"></script>
<script type="text/babel" src="tinker-app.jsx" data-presets="env,react"></script>
<script type="text/babel" src="tinker-main.jsx" data-presets="env,react"></script>
</body>
</html>
